name: Desktop Visual Review
# A focused, non-blocking-to-deploy browser review. Quality and Pages remain
# independent. Keep this small until a design milestone requires full E2E.
on:
  push:
    branches: [main]
    paths:
      - 'src/components/game/gothic-desktop-ui.css'
      - 'src/components/game/gothic-lobby.tsx'
      - 'src/components/game/gothic-lobby.css'
      - 'src/components/game/gothic-reference-layout.css'
      - 'src/components/game/gothic-premium-tokens.css'
      - 'src/components/game/gothic-red-gold.css'
      - 'src/components/game/gothic-workshop.css'
      - 'src/components/game/gothic-world.css'
      - 'src/components/game/gothic-hud.tsx'
      - 'src/components/game/game-scene-navigation.tsx'
      - 'src/components/game/game-scene-navigation.css'
      - 'e2e/route-health.spec.ts'
      - 'e2e/helpers/scene-navigation.ts'
      - 'e2e/scene-navigation.spec.ts'
      - 'app/globals.css'
      - 'app/layout.tsx'
      - 'src/components/game/gothic-premium-tokens.css'
      - 'src/components/summon/summon-screen.css'
      - 'src/components/game/gothic-hud.tsx'
      - 'src/components/game/gothic-room-doors.tsx'
      - 'src/components/game/room-art-*.tsx'
      - 'src/components/game/*-private-room.tsx'
      - 'src/components/game/room-scene-*.tsx'
      - 'src/core/room-art-*.ts'
      - 'src/lib/game/room-art-*.ts'
      - 'src/components/game/room-resident-sprite.tsx'
      - 'src/components/game/room-scene-hotspots.tsx'
      - 'src/components/summon/**'
      - 'e2e/summon-result-desktop.spec.ts'
      - 'e2e/character-collection.spec.ts'
      - 'public/art/rooms/**'
      - 'src/components/moonwork/workshop-controls.tsx'
      - 'v2/src/workshop-lab-stage.ts'
      - 'v2/src/workshop-machine-effects.ts'
      - 'v2/src/workshop-machine-materials.ts'
      - 'v2/src/workshop-machine-phases.ts'
      - 'v2/src/workshop-machine-presentation.ts'
      - 'v2/src/workshop-machine-status.ts'
      - 'v2/src/workshop-painted-art.ts'
      - 'src/lib/moonwork/workshop-auto-runtime.tsx'
      - 'v2/src/workshop-auto-production.ts'
      - 'e2e/moonwork-next-workshop.spec.ts'
      - 'e2e/workshop-dock-clearance.spec.ts'
      - 'src/components/moonwork/character-gallery-scene.tsx'
      - 'src/components/moonwork/character-gallery-scene.css'
      - 'e2e/a05-character-gallery-layout.spec.ts'
      - 'src/components/moonwork/world-ui.tsx'
      - 'src/components/moonwork/world-town.tsx'
      - 'e2e/gothic-desktop-*.spec.ts'
      - '.github/workflows/desktop-visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-visual-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_USE_SYSTEM_CHROME: '1'
jobs:
  desktop-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm --prefix v2 install --no-audit --no-fund
      - name: Install real CJK rendering fonts for screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match 'Noto Serif SC'
          fc-match ':lang=zh-cn'
      - name: Verify PC and mobile scene navigation, direct travel and overlays
        run: pnpm exec playwright test e2e/route-health.spec.ts e2e/scene-navigation.spec.ts --grep "lobby owns seven-item dock|compact scene navigation|gallery art viewer hides" --workers=1 --retries=0
      - name: Run four-scene desktop browser smoke
        run: pnpm exec playwright test e2e/gothic-desktop-hud.spec.ts e2e/gothic-desktop-scenes.spec.ts e2e/summon-result-desktop.spec.ts --workers=1 --retries=0
      # Each Playwright invocation clears test-results. Preserve these captures
      # before the A05/forge/workshop suites wipe the directory.
      - name: Preserve first-pass screenshots
        if: always()
        run: |
          mkdir -p visual-evidence/general
          find test-results -maxdepth 1 -type f \( -name 'desktop-*.png' -o -name 'mobile-lobby-*.png' \) -exec cp {} visual-evidence/general/ \; || true
      - name: Review A05 reference proportions, keyboard navigation and capture desktop/mobile screenshots
        run: pnpm exec playwright test e2e/a05-character-gallery-layout.spec.ts --workers=1 --retries=0
      - name: Run focused archive forge and room-navigation browser regression
        run: pnpm exec playwright test e2e/character-collection.spec.ts --grep "canonical summon archive|an acquired heroine|collected YueSha opens" --workers=1 --retries=0
      - name: Verify workshop canvas clearance from compact world map on PC and mobile
        run: pnpm exec playwright test e2e/workshop-dock-clearance.spec.ts --workers=1 --retries=0
      - name: Check realtime workshop starts, produces and pauses in browser
        run: pnpm exec playwright test e2e/moonwork-next-workshop.spec.ts --grep "automatic production runs" --workers=1 --retries=0
      - name: Verify A05 screenshots survive subsequent browser suites
        run: |
          test -s visual-evidence/a05/desktop-a05-reference-1672.png
          test -s visual-evidence/a05/desktop-a05-reference-1440.png
          test -s visual-evidence/a05/mobile-a05-reference-390.png
      - name: Upload actual PC browser screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v377-screenshots
          path: |
            visual-evidence/**/*.png
            test-results/desktop-*.png
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
