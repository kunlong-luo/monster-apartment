name: Desktop Visual Review
# A focused, non-blocking-to-deploy browser review. Quality and Pages remain
# independent. Keep this small until a design milestone requires full E2E.
on:
  push:
    branches: [main]
    paths:
      - 'src/components/game/gothic-desktop-ui.css'
      - 'src/components/game/gothic-hud.tsx'
      - 'src/components/game/gothic-room-doors.tsx'
      - 'src/components/moonwork/workshop-controls.tsx'
      - 'src/components/moonwork/world-ui.tsx'
      - 'src/components/moonwork/world-town.tsx'
      - 'e2e/gothic-desktop-*.spec.ts'
      - '.github/workflows/desktop-visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-visual-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_USE_SYSTEM_CHROME: '1'
jobs:
  desktop-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm --prefix v2 install --no-audit --no-fund
      - name: Run four-scene desktop browser smoke
        run: pnpm exec playwright test e2e/gothic-desktop-hud.spec.ts e2e/gothic-desktop-scenes.spec.ts --workers=1 --retries=0
      - name: Upload actual PC browser screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v366-screenshots
          path: |
            test-results/desktop-*.png
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
