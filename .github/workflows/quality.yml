name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:stable-deps
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:rules
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_USE_SYSTEM_CHROME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: google-chrome --version
      - name: Ensure CJK fonts for review screenshots
        run: |
          if ! fc-list --format '%{family}\n' | grep -qi 'Noto Sans CJK'; then
            timeout 120s sudo apt-get install -y --no-install-recommends fonts-noto-cjk || echo "CJK font installation unavailable; using system fallback"
          fi
          fc-match "Noto Sans CJK SC"
      - run: pnpm e2e
      - name: Upload desktop and mobile UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v060-battle-ui-review
          path: |
            test-results/spirit-desktop.png
            test-results/spirit-mobile.png
          if-no-files-found: warn
          retention-days: 14

  static-export:
    runs-on: ubuntu-latest
    env:
      NEXT_STATIC_EXPORT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: test -f out/index.html
