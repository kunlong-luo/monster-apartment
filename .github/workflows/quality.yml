name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:stable-deps
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:rules
      - run: pnpm test
      - run: pnpm build

  pixi-v2-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # V2 is intentionally isolated from the published Next.js/Pnpm app.
      # Check actual PixiJS 8 APIs now, before commissioning sprite assets.
      - run: npm --prefix v2 install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix v2 run typecheck

  e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_USE_SYSTEM_CHROME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: google-chrome --version
      - name: Use existing system font fallback
        run: fc-match "sans-serif"
      - run: pnpm e2e
      - name: Upload gameplay art review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v082-cozy-apartment-art-review
          path: |
            test-results/cozy-desktop.png
            test-results/cozy-mobile.png
            test-results/spirit-desktop.png
            test-results/spirit-mobile.png
          if-no-files-found: warn
          retention-days: 14

  static-export:
    runs-on: ubuntu-latest
    env:
      NEXT_STATIC_EXPORT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: test -f out/index.html
