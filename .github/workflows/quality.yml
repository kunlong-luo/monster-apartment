name: Quality
on:
  push:
    branches: [main, feat/nextjs]
  pull_request:
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:stable-deps
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:rules
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_USE_SYSTEM_CHROME: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: google-chrome --version
      - name: Install CJK fonts for readable UI screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match "Noto Sans CJK SC"
      - run: pnpm e2e
      - name: Upload desktop and mobile UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v030-ui-review
          path: |
            test-results/v030-desktop.png
            test-results/v030-mobile.png
          if-no-files-found: warn
          retention-days: 14

  static-export:
    runs-on: ubuntu-latest
    env:
      NEXT_STATIC_EXPORT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: test -f out/index.html
