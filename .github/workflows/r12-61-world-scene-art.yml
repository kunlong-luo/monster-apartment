name: R12.61 Workshop and Town Art Preparation
on:
  push:
    branches: [r12-61-world-scene-art]
    paths:
      - 'scripts/build-r12-61-world-scene-review.py'
      - '.github/workflows/r12-61-world-scene-art.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r12-61-world-scene-art
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/r12-61-world-scene-art'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Convert four verified original landscape images without resizing
        run: python scripts/build-r12-61-world-scene-review.py
      - uses: actions/upload-artifact@v4
        with:
          name: r12-61-workshop-town-review-images
          path: |
            public/art/world-scenes/workshop/review/*.webp
            public/art/world-scenes/town/review/*.webp
            public/art/world-scenes/r12-61-workshop-town-review.json
      - name: Commit output evidence on candidate branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/world-scenes/workshop/review/ public/art/world-scenes/town/review/ public/art/world-scenes/r12-61-workshop-town-review.json
          git diff --cached --quiet && exit 0
          git commit -m "assets(world): convert four independent workshop and town backgrounds"
          git push origin HEAD:refs/heads/r12-61-world-scene-art
