name: R12 Licensed Native 4K Source Review
on:
  push:
    paths:
      - ".github/workflows/r12-licensed-4k-review.yml"
      - "scripts/inspect-r12-licensed-4k-pack.py"
      - "e2e/r12-4k-live-source-review.spec.ts"
  workflow_dispatch:

# The publisher pack is reviewed ONLY. No contents:write; no production art.
permissions:
  contents: read

jobs:
  inspect-licensed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download publisher's CC BY 4.0 pack via normal itch.io source endpoint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/r12-source-tool" "$RUNNER_TEMP/r12-native4k-source"
          cd "$RUNNER_TEMP/r12-source-tool"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund itchio-downloader@1.1.0
          PACK_DIR="$RUNNER_TEMP/r12-native4k-source" node - <<'JS'
          const {downloadGameDirect}=require('itchio-downloader');
          (async()=>{
            const result=await downloadGameDirect({
              itchGameUrl:'https://ebbasuke.itch.io/gloomy-mansion-background-pack',
              downloadDirectory:process.env.PACK_DIR,
              writeMetaData:false,
              resume:true
            });
            console.log('Publisher download:',result.status,
              'bytes:',result.bytesDownloaded,
              'reason:',result.failReason||'none');
            if(!result.status)throw Error('Original pack download unavailable: '+result.message);
          })().catch(error=>{console.error(error.message);process.exitCode=1});
          JS
      - name: Inspect actual originals and create review-only contact sheet
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/inspect-r12-licensed-4k-pack.py \
            --archive-dir "$RUNNER_TEMP/r12-native4k-source" \
            --out "$RUNNER_TEMP/r12-4k-review"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm --prefix v2 install --no-audit --no-fund
      - name: Check system Chromium and CJK text rendering
        run: |
          google-chrome --version
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture REAL PC and mobile Chromium game screenshots using local 4K review sources
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PLAYWRIGHT_USE_SYSTEM_CHROME: "1"
          R12_SOURCE_REVIEW_DIR: ${{ runner.temp }}/r12-4k-review/local-preview-only
          R12_LIVE_SCREENSHOT_DIR: ${{ runner.temp }}/r12-4k-review/live-screenshots
        run: pnpm exec playwright test e2e/r12-4k-live-source-review.spec.ts --workers=1 --retries=0
      - name: Upload reviewed source evidence and real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-ebbasuke-native-4k-review-only
          path: ${{ runner.temp }}/r12-4k-review/
          if-no-files-found: warn
          retention-days: 14
