name: Gothic Manor Full ZIP Review
on:
  push:
    paths:
      - ".github/workflows/gothic-source-pack.yml"
      - "scripts/catalog-gothic-source-pack.py"
      - "scripts/build-lobby-feature-postcards.py"
      - "scripts/build-world-stage-scenes.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-free-source-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download publisher's free source ZIP through its normal download endpoint
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/itch-download-tool" "$RUNNER_TEMP/gothic-source-pack"
          cd "$RUNNER_TEMP/itch-download-tool"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund itchio-downloader@1.1.0
          PACK_DIR="$RUNNER_TEMP/gothic-source-pack" node - <<'JS'
          const {downloadGameDirect}=require('itchio-downloader');
          (async()=>{
            const r=await downloadGameDirect({
              itchGameUrl:'https://winechan.itch.io/gothic-manor',
              downloadDirectory:process.env.PACK_DIR,
              writeMetaData:false,resume:true
            });
            console.log('Download status',r.status,'bytes',r.bytesDownloaded,'reason',r.failReason||'none');
            if(!r.status)throw Error('Publisher download unavailable: '+r.message);
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
      - name: Audit all original artwork resolutions and save review candidates
        run: |
          python3 -m pip install -q Pillow
          python3 scripts/catalog-gothic-source-pack.py "$RUNNER_TEMP/gothic-source-pack"
      - name: Create 960x320 room-independent lobby location postcards
        run: python3 scripts/build-lobby-feature-postcards.py "$RUNNER_TEMP/gothic-source-pack"
      - name: Create native-size world environment layers
        run: python3 scripts/build-world-stage-scenes.py "$RUNNER_TEMP/gothic-source-pack"
      - name: Upload source review report and genuine candidate images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winechan-gothic-manor-real-zip-review
          path: docs/art-reviews/sources/winechan-gothic-manor-full-pack/
          if-no-files-found: warn
      - name: Commit review assets and verified lobby-only feature posters
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/art-reviews/sources/winechan-gothic-manor-full-pack/ public/art/feature-postcards/ public/art/world-scenes/
          if ! git diff --cached --quiet; then
            git commit -m "assets(art): add verified navigation postcards, keep rooms under review"
            TOKEN64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $TOKEN64" push origin HEAD:main
          fi
