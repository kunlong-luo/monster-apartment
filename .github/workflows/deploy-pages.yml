name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: monster-apartment-pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only deploy verified pushes on main (or an explicit manual run).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_STATIC_EXPORT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: test -f out/index.html
      - run: test -s out/town/index.html && test -s out/orders/index.html && test -s out/characters/index.html && test -s out/warehouse/index.html && test -s out/workshop/index.html
      - run: npm --prefix v2 install --no-audit --no-fund
      - run: npm --prefix v2 run build
      # Preserve Next's page HTML; only copy Pixi assets into its route.
      - run: mkdir -p out/workshop/assets out/workshop-lab && cp -a v2/dist/assets/. out/workshop/assets/ && cp -a v2/dist/. out/workshop-lab/
      - run: test -s out/workshop/assets/workshop.js
      - run: test -s out/workshop/assets/workshop-runtime.js
      - run: test -s out/workshop-lab/index.html
      - run: test -s out/workshop/assets/moon-workshop.avif
      - run: test -s out/workshop/assets/moonveil-portrait.avif
      - run: test -s out/workshop/assets/moonstone-floor.avif
      - run: test -s out/workshop/assets/kiln-art-review.avif
      - run: test -s out/workshop/assets/well-art-review.avif
      - run: test -s out/workshop/assets/garden-art-review.avif
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
