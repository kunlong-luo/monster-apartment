name: One-shot Safe Branch Cleanup
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-safe-branch-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: branch-cleanup-one-shot
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'kunlong-luo/monster-apartment' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Preflight exact SHA and closed PR state, then delete redundant refs
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            if (owner!=='kunlong-luo'||repo!=='monster-apartment'||context.ref!=='refs/heads/main') {
              throw new Error('Refusing to clean outside intended repository/default branch');
            }
            const expected={
              "art/r12-licensed-4k-mansion-intake": "aab5f874d76186a039bb65692a8d9665b002574d",
              "art/r12-real-browser-4k-scene-proof": "c8fca158324319a1c47d80aa6a7f0e28a3d56a6d",
              "art/r12-s02-licensed-mansion-originals-review": "651fb6d16b5f542083e7878d2fbc9e085292a9b9",
              "ci/r113-gate-pages-quality-only": "974ce97b75c07eb3b56e0978bbe22a0f3ab353b5",
              "docs/r11.3-main-acceptance": "800d647a4fc617ac6903be2ffd5f8e3cb9e25bec",
              "docs/r12-real-browser-pixel-findings": "ba4081b16b6dcea593cb323bc6085e8159937bb2",
              "docs/r12-visual-art-nav-rebuild-plan": "30728f931ac6a4df8cfcbfd3af6d186759c57769",
              "docs/r113-post-pr15-release-and-playtest": "b6a50be9baf88e7d9161a0600977920559a53045",
              "docs/r113-technical-release-certification-20261114": "510483dab5e60a75e59872889e7f9868fd277f18",
              "feat/r12-compact-mobile-room-chooser": "327199d885523cad9d973fc83d479bbc6f5343f6",
              "feat/r12-dual-viewport-scene-art-review": "7df6d1ad46b805387644451e28652412f872c930",
              "feat/r12-image-pixel-evidence": "83cb8faf0cd833046b4c77701d30de407016e542",
              "feat/r12-local-scene-art-preview": "c057ddd438006a572393a8470443ee12a962361a",
              "feat/r12-production-scene-runtime-wiring": "148f302b8f0591666627d46ae709b95ed2d3655c",
              "feat/r12-s02-independent-mobile-art-review": "d10cd79f893db7d678e5e8a1920bb5c10e123cc3",
              "feat/r12-s02-independent-mobile-candidate": "d424646d8f99b2404d90c9e551c55237f7e6a02f",
              "feat/r12-s02-six-room-art-hotspot-gate": "be82d8cb0f611ce2f6f98b0b38e3aadc6fde8d5e",
              "feat/r12-s05-independent-mobile-review": "ab84d4daf66109ea4c5bc38063878aee921ee93f",
              "feat/r12-s06-mobile-source-provenance": "4f60631a7bfbb6d424a24ef4eabfff64ac1f4f01",
              "feat/r12-scene-art-admission-gate": "189d43e652f98476b326c8d0b426e18456a42ace",
              "feat/r12-source-pack-pixel-gate": "c5b8b44833e3440686a10af8be1d017f07f35c8c",
              "feat/r113-anonymous-playtest-capture": "79a4df5a46a31528abb754b47664fbe3e5a1a907",
              "feat/r1202-cinematic-lobby-navigation": "46b823b257b696f9fb5e655d200d0e029440b79d",
              "fix/apartment-stale-corrupt-save-reset": "c98bfe0c30b79e54d2d9f27d22012bd2184388ee",
              "fix/ci-gameplay-paths-bun-cache": "2eb34620780aac59f3a8f2bbfa05a4fcf597f02c",
              "fix/cozy-locked-save-transactions": "6a0aad48e08ea7c7be1a9426bbc3f4c12d08ee0d",
              "fix/r12-apartment-mobile-hud-clipping": "9b7e1fffac5e396443d1ec655f9b2ee9d4c14eec",
              "fix/r12-approved-hero-failure-no-lowres": "08b0727352a00aa89c199883b2eb0fa22532746a",
              "fix/r12-backdrop-failed-original-guard": "284add003bfb566afd5c21286a727d6d7060f9da",
              "fix/r12-gallery-portrait-pixel-safe": "644ec595252537454985c7f9c7d51dd1f9f339e3",
              "fix/r12-mobile-lobby-art-clearance": "27248d1338f4461ee591197c6634dcadc768d7f8",
              "fix/r12-production-dpr-art-gate": "d781ab9d80cd36208aeb3e9b33dcce02b1cfba5f",
              "fix/r12-remove-upscaled-workshop-hero": "bd40ac35cf13108818696240243e8f488e2f061b",
              "fix/workshop-corrupt-reset-lock": "853fd7ba8857fe18d2d215072afcd8a640ba8636",
              "fix/workshop-recover-dexie-backup": "18c557bf865a25e1849ea076c68835c026d9ee3d",
              "fix/workshop-reset-confirmation": "7d2d22ed7bc8808c310b158c15c1761c967985ac",
              "release/r11.3-baseline-regression": "d670f25a14514e9f69fba0b00d7182cb09a67506"
            };
            const rejected={"feat/r12-s02-independent-mobile-art-review":34,"art/r12-s02-licensed-mansion-originals-review":49};
            const info=(await github.rest.repos.get({owner,repo})).data;
            if(info.default_branch!=='main')throw new Error('Default branch changed');
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'all',per_page:100});
            if(prs.some(pr=>pr.state==='open'))throw new Error('An open PR exists; refuse cleanup');
            const names=Object.keys(expected);
            const plan=[];
            if(names.length!==37)throw new Error('Unexpected allowlist length '+names.length);
            for(const name of names){
              if(name==='main')throw new Error('Default branch in allowlist');
              const b=branches.find(b=>b.name===name);
              if(!b){core.info('Already missing: '+name);continue;}
              if(b.protected||b.commit.sha!==expected[name])throw new Error('Protected or changed head: '+name);
              const matching=prs.filter(pr=>pr.head.ref===name && pr.head.repo?.full_name===owner+'/'+repo);
              if(matching.length!==1)throw new Error('Ambiguous or unmatched PR: '+name);
              const pr=matching[0];
              if(pr.state!=='closed'||pr.base.ref!=='main')throw new Error('Branch has open or different-base PR: '+name);
              if(!pr.merged_at && rejected[name]!==pr.number){
                throw new Error('Unique unmerged work not explicitly rejected/superseded: '+name);
              }
              if(pr.merged_at && rejected[name])throw new Error('Exception PR unexpectedly merged: '+name);
              plan.push({name,pr:pr.number,why:pr.merged_at?'merged':'closed; superseded/rejected'});
            }
            const unexpected=branches.filter(b=>b.name!=='main'&&!Object.hasOwn(expected,b.name));
            if(unexpected.length)throw new Error('New unreviewed branch(es): '+unexpected.map(b=>b.name).join(', '));
            core.info('Preflight passed for '+plan.length+' refs; no open PRs. Deleting now.');
            let removed=0;
            for(const item of plan){
              await github.rest.git.deleteRef({owner,repo,ref:'heads/'+item.name});
              removed++;
              core.info('Deleted '+item.name+' (PR #'+item.pr+', '+item.why+')');
            }
            await core.summary
              .addHeading('One-time reviewed branch cleanup')
              .addRaw('Deleted '+removed+' non-default branches, preserving main and all PR histories.\n')
              .addTable(plan.map(i=>[{data:i.name},{data:'#'+i.pr},{data:i.why}]))
              .write();
