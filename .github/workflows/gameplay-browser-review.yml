name: Gameplay Browser Review

# Full gameplay/browser regression automatically runs on gameplay, engine,
# save, navigation, dependency and E2E changes on both PR and matching main.
# Documentation and art-only changes keep the fast Quality + visual PR gate
# without spending ~12 minutes on the full browser suite. Manual full remains
# available for release milestones; R09 diagnostics run in dedicated workflows.
on:
  pull_request:
    paths:
      - 'app/**/*.tsx'
      - 'app/**/*.css'
      - 'src/components/game/**'
      - 'src/components/moonwork/**'
      - 'src/components/summon/**'
      - 'src/lib/moonwork/**'
      - 'src/lib/game/**'
      - 'src/lib/summon/**'
      - 'src/core/**'
      - 'v2/src/**'
      - 'v2/scripts/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'v2/package.json'
      - 'v2/package-lock.json'
      - '.github/workflows/gameplay-browser-review.yml'
  push:
    branches: [main]
    paths:
      - 'app/**/*.tsx'
      - 'app/**/*.css'
      - 'src/components/game/**'
      - 'src/components/moonwork/**'
      - 'src/components/summon/**'
      - 'src/lib/moonwork/**'
      - 'src/lib/game/**'
      - 'src/lib/summon/**'
      - 'src/core/**'
      - 'v2/src/**'
      - 'v2/scripts/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'next.config.ts'
      - 'package.json'
      - 'bun.lock'
      - 'v2/package.json'
      - 'v2/package-lock.json'
      - '.github/workflows/gameplay-browser-review.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Browser test scope
        type: choice
        options:
          - smoke
          - full
        default: smoke
        required: true

permissions:
  contents: read

concurrency:
  group: gameplay-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_USE_SYSTEM_CHROME: '1'

jobs:
  browser-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      # Root lockfile is bun.lock (there is no pnpm-lock.yaml).
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm --prefix v2 install --no-audit --no-fund
      - run: google-chrome --version
      - name: Check system font fallback
        run: fc-match "sans-serif"
      - name: Fast route/browser smoke
        if: ${{ inputs.suite == 'smoke' }}
        run: pnpm exec playwright test e2e/route-health.spec.ts e2e/gothic-desktop-hud.spec.ts e2e/gothic-desktop-scenes.spec.ts --workers=1 --retries=0
      - name: Full gameplay/visual regression (milestone)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'full' }}
        run: pnpm e2e
      - name: Upload milestone screenshots
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.suite == 'full') }}
        uses: actions/upload-artifact@v4
        with:
          name: gothic-game-art-review
          path: |
            test-results/welcome-desktop.png
            test-results/welcome-mobile.png
            test-results/summon-desktop.png
            test-results/summon-mobile.png
            test-results/gothic-lobby-desktop.png
            test-results/gothic-lobby-mobile.png
            test-results/gothic-apartment-desktop.png
            test-results/gothic-apartment-mobile.png
            test-results/room-*-desktop.png
            test-results/room-*-mobile.png
            visual-evidence/workshop/desktop-workshop-true-dialogue-r107-1440.png
            visual-evidence/workshop/mobile-workshop-true-dialogue-r113-390.png
            visual-evidence/workshop/mobile-workshop-reduced-motion-r107-390.png
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload targeted desktop HUD screenshots
        if: ${{ always() && inputs.suite == 'smoke' }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v364-visual-review
          path: |
            test-results/desktop-lobby-v364.png
            test-results/desktop-summon-v364.png
            test-results/desktop-workshop-v365.png
            test-results/desktop-apartment-v365.png
            test-results/desktop-town-v365.png
          if-no-files-found: ignore
          retention-days: 14
