name: R12 Art Pixel Evidence

# #24/#16 evidence collection is intentionally separate from quality approval.
# This workflow records real image dimensions, DPR and screenshots; it cannot
# certify artistic quality, licensing, or a concept asset's production status.
on:
  pull_request:
    paths:
      - 'public/art/**'
      - 'v2/art/**'
      - 'src/components/game/gothic-lobby.tsx'
      - 'src/components/game/gothic-lobby.css'
      - 'src/components/moonwork/world-orders.tsx'
      - 'src/components/moonwork/world-warehouse.tsx'
      - 'src/components/moonwork/world-town.tsx'
      - 'e2e/r12-image-evidence.spec.ts'
      - '.github/workflows/r12-art-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r12-art-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PLAYWRIGHT_USE_SYSTEM_CHROME: '1'

jobs:
  pixel-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.13.0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm --prefix v2 install --no-audit --no-fund
      - name: Install fonts for Chinese text inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Record real scene dimensions and DPR / cover evidence
        run: pnpm exec playwright test e2e/r12-image-evidence.spec.ts --workers=1 --retries=0
      - name: Upload source-level and visual inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r12-image-pixel-evidence
          path: |
            visual-evidence/r12/report.json
            visual-evidence/r12/*.png
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14
